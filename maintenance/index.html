<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diese Seite wird gerade überarbeitet." />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dominik Hein</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --text: #f4f4f6;
        --muted: #a1a1aa;
        --accent: #7fffd4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 32rem;
        text-align: center;
      }

      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-bottom: 28px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 24px var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }

      h1 {
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      p {
        margin-top: 16px;
        font-size: 1.0625rem;
        line-height: 1.6;
        color: var(--muted);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.8);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="dot" aria-hidden="true"></span>
      <h1>Hier wird gerade umgebaut.</h1>
      <p>Bald gibt es hier wieder etwas zu sehen.</p>
    </main>
  </body>
</html>
